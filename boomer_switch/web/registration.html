<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Lights access</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/entry.js" defer></script>
  <script src="/registration.js" defer></script>
</head>
<body>
<main>
  <header class="page-header">
    <span class="demo-label">Local demo · Sample lights</span>
    <h1>House Lights</h1>
    <p>Verify your email to request access.</p>
  </header>
  <p id="registration-status" role="status">Checking access…</p>
  <button id="retry-access" type="button" hidden>Try access again</button>
  <p id="entry-recovery" hidden>Keep this page open. If you reload, reopen the invitation.</p>
  <form id="details" hidden>
    <fieldset disabled>
    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="name" maxlength="80" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
    <button id="send-code" type="submit">Send code</button>
    </fieldset>
  </form>
  <form id="verification" hidden>
    <fieldset disabled>
    <p id="code-help">The code expires after 10 minutes.</p><label for="code">Verification code</label>
    <input id="code" aria-describedby="code-help" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
    <button id="verify-code" type="submit">Verify code</button>
    <button id="resend-code" type="button">Send new code</button>
    </fieldset>
  </form>
  <div id="controls" hidden>
    <p id="connection" role="status">Checking lights…</p>
    <div id="rooms" aria-label="Lights by room"></div>
  </div>
</main>
</body>
</html>
