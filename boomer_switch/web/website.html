<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Lights access</title><link rel="stylesheet" href="style.css"><script src="entry.js" defer></script><script src="website.js" defer></script></head>
<body><main><h1>House Lights</h1><p id="status" role="status">Checking access</p>
<button id="retry-access" type="button" hidden>Try access again</button>
<p id="entry-recovery" hidden>Keep this page open. If you reload, reopen the invitation.</p>
<form id="details" hidden><fieldset disabled><label for="name">Name</label><input id="name" autocomplete="name" maxlength="80" required>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" maxlength="254" required><button id="send-code">Send code</button></fieldset></form>
<form id="verification" hidden><fieldset disabled><p id="code-help">The code expires after 10 minutes.</p><label for="code">Verification code</label><input id="code" aria-describedby="code-help" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button id="verify-code">Verify code</button><button type="button" id="resend">Send new code</button></fieldset></form>
<p id="connection" role="status" hidden>Waiting for the home connection</p>
<section id="controls" hidden aria-label="Light controls">
<div id="rooms"></div></section>
<p>Use the home internet connection. This IPv4 pilot cannot distinguish home Wi-Fi, wired connections, or a home VPN.</p></main></body></html>
