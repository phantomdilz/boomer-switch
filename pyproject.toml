[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boomer-switch"
version = "0.1.0"
requires-python = ">=3.11"
description = "Phone page for approved guests to switch home lights"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-xdist>=3,<4", "segno==1.6.6", "mnemonic==0.21", "pypdf==7.0.0", "reportlab==5.1.0", "python-kasa==0.12.0", "aiohttp==3.14.5", "cryptography==50.0.2", "dkimpy==1.1.8", "dnspython==2.8.0"]
demo = ["playwright==1.62.0", "segno==1.6.6", "Pillow==13.0.0", "zxing-cpp==3.1.1", "mnemonic==0.21"]
website = ["mnemonic==0.21", "segno==1.6.6"]
mail-signing = ["dkimpy==1.1.8", "dnspython==2.8.0"]
pdf = ["pypdf==7.0.0", "reportlab==5.1.0", "segno==1.6.6", "mnemonic==0.21"]
pilot = ["python-kasa==0.12.0", "aiohttp==3.14.5"]

[tool.setuptools.packages.find]
include = ["boomer_switch*"]

[tool.setuptools.package-data]
boomer_switch = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.data-files]
"share/boomer-switch/hosting" = ["hosting/passenger_wsgi.py", "hosting/passenger-config.example.json", "hosting/index.php", "hosting/owner_telegram.php", "hosting/owner_telegram_cli.php", "hosting/prepare_owner_bot.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "lights: device selection and control boundary",
  "demo: local sample-light web service",
  "registration: invitations, verification, and demo access",
  "people: private owner access management",
  "cards: private-template invitation rendering",
  "pilot: real-provider adapters and the outbound home runner",
  "tooling: test infrastructure checks",
  "smoke: fast deterministic acceptance checks",
]
